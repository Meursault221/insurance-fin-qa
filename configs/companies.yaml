# ============================================================
# 10 家上市保险公司元数据
#
# 用途：
#   1. 脚本按文件名自动识别 company / report_name / 页码来源标签
#   2. 第二阶段建索引时按 company 做过滤
#
# ⚠️ 注意：
#   - stock_codes 请你在放 PDF 之前**核对一遍**（尤其港股代码）。
#     本文件里的代码是初始草稿，未逐一到交易所页面验证，
#     已用 verified: false 标记，核对后改成 true。
#   - report_name 里 A股用简体《2025年年度报告》，
#     港股用《2025年報》/《2025年年報》，按你实际下载到的 PDF 封面填写。
#   - 所有 *_url 字段留空，不要编造。你下载后把真实来源 URL 填进去，
#     最终报告的“来源可追溯”就靠它。
# ============================================================

