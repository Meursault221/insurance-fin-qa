# 检索层评测题目集
#
# targets 的页码是**从 data/chunks 里实际查出来的**，不是凭印象写的：
# 用「该数字 + 该指标名」同时出现在同一 chunk 里作条件，扫出所有页。
#
# 为什么一个 target 有很多页：同一个数字在年报里会重复出现 5~8 次
# （财务摘要、主要财务数据、董事长致辞、经营业绩讨论、财务报表、附录）。
# 对"这个指标是多少"这类问题，**任何一页都是正确答案** —— 用户拿到
# 财务摘要页和拿到财务报表页都算答对了。只标一页会把检索对的判成错的
# （实测第一版只标了最初查到的那一页，把 BM25 的命中率从 52% 压到 41%）。
#
# pages   = 所有承载该答案的页（判定用）
# primary = 最规范的那一页（财务摘要 / 主要财务数据），供人工核对时先看它
#
# expect_companies：期望自动识别出的公司。跨公司题刻意不设公司过滤，
# 硬过滤会把另一半答案切掉。
#
# kind：exact 问法接近原文（BM25 主场）/ semantic 换了说法（向量主场）/ cross 跨公司

meta:
  version: 2
  note: 页码为 PDF 物理页号，与 data/chunks/*.jsonl 的 page 字段一致
  unit_note: 各家年报的金额单位不同（百万元/千元/亿港元），题目不预设单位，只看页码与公司
  gold_note: pages 由「数字 + 指标名同现」扫出，覆盖该答案的全部出现页

questions:

  # ---------------------------------------------------------------- 中国平安
  - id: q01
    question: 中国平安2025年归属于母公司股东的净利润是多少？
    kind: exact
    expect_companies: [pingan]
    targets:
      - company: pingan
        primary: 15
        pages: [14, 15, 40, 41, 44, 83, 191, 364]
        note: 财务摘要 p15「归属于母公司股东的净利润 134,778」（百万元）

  - id: q02
    question: 中国平安2025年末的总资产规模是多少？
