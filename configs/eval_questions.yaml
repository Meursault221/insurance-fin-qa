    targets:
      - company: pingan
        primary: 15
        pages: [10, 15, 49, 75, 76, 78, 79, 81]
        note: p15「新业务价值 36,897」（百万元）/ p10 368.97亿元

  - id: q04
    question: 中国平安财产保险业务2025年的整体综合成本率是多少？
    kind: exact
    expect_companies: [pingan]
    targets:
      - company: pingan
        primary: 15
        pages: [10, 15, 53, 55, 56]
        note: p15「综合成本率(%) 96.8」

  - id: q05
    question: 平安去年一年赚了多少钱？
    kind: semantic
